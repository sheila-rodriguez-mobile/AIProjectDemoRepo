name: Stale Cleaner

on:
  schedule:
    - cron: '20 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  stale-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Run PR cleaner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_PATH: .github/stale-cleaner.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: python3 .github/scripts/stale_cleaner.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-cleaner-report
          path: |
            .github/stale-cleaner-report.json
            .github/stale-cleaner-history.jsonl
          if-no-files-found: ignore
