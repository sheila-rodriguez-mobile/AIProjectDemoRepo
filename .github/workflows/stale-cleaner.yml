name: Stale Cleaner

on:
  schedule:
    # Every day, including weekends. Each stale stage is a 3-day-wide window
    # (see pull_request_thresholds); running only on weekdays left a 3-day gap
    # between Friday and Monday, which was enough for an inactive PR's day
    # count to jump straight past the "warning" (and sometimes "escalated")
    # window between two scans.
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  stale-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      # Phase 3: the agent's memory must survive between runs. Each run restores
      # the newest snapshot and saves a new one (caches are immutable per key).
      - name: Restore agent memory
        uses: actions/cache/restore@v4
        with:
          path: .github/stale-cleaner-memory.json
          key: stale-cleaner-memory-${{ github.run_id }}
          restore-keys: |
            stale-cleaner-memory-

      - name: Run PR cleaner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_PATH: .github/stale-cleaner.json
          STALE_CLEANER_MEMORY_PATH: .github/stale-cleaner-memory.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: python3 .github/scripts/stale_cleaner.py

      - name: Save agent memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/stale-cleaner-memory.json
          key: stale-cleaner-memory-${{ github.run_id }}

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-cleaner-report
          path: |
            .github/stale-cleaner-report.json
            .github/stale-cleaner-history.jsonl
            .github/stale-cleaner-memory.json
          if-no-files-found: ignore
